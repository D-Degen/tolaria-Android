plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'md.tolaria.smartnotes'
version = '0.1.0'

android {
  namespace "md.tolaria.smartnotes"
  defaultConfig {
    versionCode 1
    versionName "0.1.0"
  }
}

dependencies {
  compileOnly 'com.google.mlkit:genai-prompt:1.0.0-beta4'
}

