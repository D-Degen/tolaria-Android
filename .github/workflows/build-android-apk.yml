name: Build Android APK (Pixel 10)

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'apps/mobile/**'
      - '.github/workflows/build-android-apk.yml'
      - 'package.json'
      - 'pnpm-lock.yaml'

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Tolaria Release APK
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup pnpm
        uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa
        with:
          version: 10

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Android native project (Expo Prebuild)
        working-directory: apps/mobile
        env:
          CI: '1'
          SENTRY_DISABLE_AUTO_UPLOAD: 'true'
          SENTRY_DISABLE_NATIVE_DEBUG_UPLOAD: 'true'
        run: |
          pnpm exec expo prebuild --platform android --no-install
          echo "android.lint.checkReleaseBuilds=false" >> android/gradle.properties
          echo "android.lint.abortOnError=false" >> android/gradle.properties
          sed -i 's/-Xmx2048m -XX:MaxMetaspaceSize=512m/-Xmx4096m -XX:MaxMetaspaceSize=1024m/' android/gradle.properties

      - name: Setup Gradle cache
        uses: gradle/actions/setup-gradle@0b6dd653ba04f4f93bf581ec31e66cbd7dcb644d # v4

      - name: Build Standalone Release APK
        working-directory: apps/mobile/android
        env:
          SENTRY_DISABLE_AUTO_UPLOAD: 'true'
          SENTRY_DISABLE_NATIVE_DEBUG_UPLOAD: 'true'
        # Pixel 10 utilizes arm64-v8a architecture; disable release lint to avoid 3rd-party library lint failures
        run: |
          ./gradlew assembleRelease \
            -PreactNativeArchitectures=arm64-v8a \
            -x lint \
            -x lintVitalRelease \
            -x lintVitalAnalyzeRelease \
            -x lintVitalReportRelease \
            --parallel \
            --build-cache

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Tolaria-Pixel10-Release-APK
          path: apps/mobile/android/app/build/outputs/apk/release/*.apk
          retention-days: 14
          if-no-files-found: error
