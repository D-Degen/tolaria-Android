name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'apps/mobile/**'
      - '.github/workflows/build-android-apk.yml'
      - 'package.json'
      - 'pnpm-lock.yaml'

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Tolaria Release APK
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup pnpm
        uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa
        with:
          version: 10

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Inject Dynamic Android VersionCode (Run Number)
        id: dynamic-versioncode
        run: |
          DYNAMIC_VERSION_CODE=$((10 + ${{ github.run_number }}))
          echo "Setting Android versionCode to ${DYNAMIC_VERSION_CODE}"
          node -e "
            const fs = require('fs');
            const path = './apps/mobile/app.json';
            const app = JSON.parse(fs.readFileSync(path, 'utf8'));
            app.expo.android.versionCode = ${DYNAMIC_VERSION_CODE};
            fs.writeFileSync(path, JSON.stringify(app, null, 2) + '\n');
          "
          echo "versionCode=${DYNAMIC_VERSION_CODE}" >> $GITHUB_OUTPUT

      - name: Generate Android native project (Expo Prebuild)
        working-directory: apps/mobile
        env:
          CI: '1'
          SENTRY_DISABLE_AUTO_UPLOAD: 'true'
          SENTRY_DISABLE_NATIVE_DEBUG_UPLOAD: 'true'
        run: pnpm exec expo prebuild --platform android --no-install

      - name: Setup Gradle cache
        uses: gradle/actions/setup-gradle@0b6dd653ba04f4f93bf581ec31e66cbd7dcb644d # v4

      - name: Build Standalone Release APK
        working-directory: apps/mobile/android
        env:
          CI: '1'
          NODE_OPTIONS: '--max-old-space-size=4096'
          SENTRY_DISABLE_AUTO_UPLOAD: 'true'
          SENTRY_DISABLE_NATIVE_DEBUG_UPLOAD: 'true'
        # Build release APK for all Android architectures (universal); disable release lint tasks to skip 3rd-party library lint issues
        run: ./gradlew assembleRelease -PreactNativeArchitectures=armeabi-v7a,arm64-v8a,x86,x86_64 -PversionCode=${{ steps.dynamic-versioncode.outputs.versionCode }} -x lint -x lintVitalRelease -x lintVitalAnalyzeRelease --stacktrace

      - name: Extract Mobile Version
        id: mobile-version
        run: |
          VERSION=$(node -p "require('./apps/mobile/package.json').version")
          echo "version=${VERSION}" >> $GITHUB_OUTPUT

      - name: Prepare Named Release APK
        run: |
          VERSION="${{ steps.mobile-version.outputs.version }}"
          mkdir -p release-dist
          cp apps/mobile/android/app/build/outputs/apk/release/*.apk release-dist/Tolaria-v${VERSION}.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Tolaria-Release-APK
          path: release-dist/*.apk
          retention-days: 14
          if-no-files-found: error

      - name: Create or Update GitHub Pre-Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v${{ steps.mobile-version.outputs.version }}
          name: Tolaria Mobile v${{ steps.mobile-version.outputs.version }}
          generate_release_notes: true
          files: release-dist/*.apk
          prerelease: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
